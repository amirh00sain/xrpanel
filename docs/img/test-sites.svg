<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="-apple-system,'SF Pro Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',Tahoma,sans-serif">
<title id="t">Rotating test sites</title><desc id="d">Nine default sites used in turn by the Fragment measurement</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05090a"/><stop offset=".55" stop-color="#091311"/><stop offset="1" stop-color="#060b0f"/></linearGradient>
<linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".45" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".13"/></linearGradient>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".35" stop-color="#fff" stop-opacity=".08"/><stop offset=".7" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
<radialGradient id="spec" cx=".12" cy="0" r=".95"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="caus" cx=".9" cy="1.05" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#52e39a"/></linearGradient>
<filter id="orb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="760"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="760"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#fff" opacity=".35"/></pattern>

</defs>
<style>
.t{font-weight:700;fill:#f3f8f5} .s{fill:#9db0a7} .m{font-family:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace} .fa{direction:rtl;unicode-bidi:plaintext}
.k{fill:#dfe9e4} .b{font-weight:600}
.flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite} @keyframes flow{to{stroke-dashoffset:-32}}
.fl{animation:fl 6s ease-in-out infinite} .fl2{animation:fl 7s ease-in-out -2s infinite} .fl3{animation:fl 8s ease-in-out -4s infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite} @keyframes pu{50%{opacity:.35}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 22s linear infinite} @keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.flow,.fl,.fl2,.fl3,.pulse,.spin{animation:none}}

</style>
