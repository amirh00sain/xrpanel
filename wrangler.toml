name = "xr-panel-pages"
pages_build_output_dir = "public"
compatibility_date = "2025-06-01"

# Cloudflare Pages project. Create the namespace once with:
#   npx wrangler kv namespace create XR_PANEL
# then paste its id below (or add the binding in the Pages dashboard).
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
