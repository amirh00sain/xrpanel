name = "xr-panel-pages"
pages_build_output_dir = "public"
compatibility_date = "2025-06-01"

# Cloudflare Pages project. Create the database once with:
#   npx wrangler d1 create xr-panel-db
# then paste its id below (or add the D1 binding in the Pages dashboard).
[[d1_databases]]
binding = "DB"
database_name = "xr-panel-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
